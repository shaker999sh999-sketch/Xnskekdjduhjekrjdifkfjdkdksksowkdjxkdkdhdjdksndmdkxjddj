<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الموقع معطّل</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --accent: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a;
      --card: #1c2128;
      --text: #f0f2f5;
      --muted: #9aa4b2;
      --accent: #ef6b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }
  .card {
    background: var(--card);
    max-width: 480px;
    width: 100%;
    padding: 40px 28px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .icon {
    font-size: 56px;
    color: var(--accent);
    margin-bottom: 12px;
  }
  h1 { margin: 0 0 12px; font-size: 26px; }
  p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.8; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon">⚠</div>
    <h1>عذرًا، الموقع تم تعطيله</h1>
    <p>هذا الموقع غير متاح حاليًا.</p>
  </main>
</body>
</html>
